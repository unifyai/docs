# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-ast
  - id: trailing-whitespace
  - id: end-of-file-fixer

- repo: https://github.com/asottile/add-trailing-comma
  rev: v3.1.0
  hooks:
  - id: add-trailing-comma

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args:
    - --autofix
    - --preserve-quotes
    - --indent=2

- repo: local
  hooks:
  - id: black
    name: Format with Black
    entry: poetry run black
    language: system
    types: [python]

- repo: local
  hooks:
  - id: agents-md-fresh
    name: AGENTS.md is up to date
    entry: "sh -c 'if [ -f .agents/global-rules/build_agents_md.py ]; then python3 .agents/global-rules/build_agents_md.py --check; else echo \"shared-rules submodule not checked out; skipping AGENTS.md check\"; fi'"
    language: system
    pass_filenames: false
    files: ^(\.agents/|AGENTS\.md$)
