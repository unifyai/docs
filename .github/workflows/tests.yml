name: Testing Code Examples

on: push

jobs:

  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # poetry install pulls the path dep on ../unify, which is absent in CI.
    # Install the same Black pin declared in pyproject.toml instead.
    - name: Install black
      run: pip install 'black==26.5.1'
    - name: Run black check
      run: black --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      uses: knowsuchagency/poetry-install@v1
      env:
        POETRY_VIRTUALENVS_CREATE: false

    - name: Run Tests
      run: poetry run pytest -vv --cov="docs" -n 4 .
      env:
        UNIFY_KEY: ${{ secrets.UNIFY_API_KEY }}
